name: Intelligence - Growth Maintenance Analysis
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
  schedule:
    - cron: "43 5 * * 2,4"  # America/Chicago, all year
      timezone: America/Chicago
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # was 20; ~4x median 0.3m over 8 green runs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      # The delegated-authority / self-heal / notification-queue steps that stood here
      # ran in dry_run, committed nothing and repaired nothing (removed 1 Nov 2026).
      # Real repair of published pages is the search loop's CHECK + REPAIR stage
      # (Search Loop workflow, seq23/search-loop): strengthen, undo, merge.
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow growth-maintenance-analysis.yml
      - run: npm run intelligence:growth-maintenance
      - run: npm run intelligence:authority
      - run: npm run intelligence:growth-brief
      - name: Commit maintenance briefs
        run: |
          git config user.name "approvalprep-bot"
          git config user.email "hello@approvalprep.com"
          git add data/intelligence
          git diff --cached --quiet || git commit -m "Update growth maintenance intelligence"
          bash scripts/workflows/safe-push-main.sh
