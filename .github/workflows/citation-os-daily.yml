name: Citation OS Daily

on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Manual fixture trace only; not production telemetry proof"
        required: false
        default: "true"
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: write

concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  citation-os-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run citation-os:daily
      - name: Cadence gate
        # This workflow publishes. content:generate, content:generate-pages and
        # seo:sitemap all run inside citation-os:daily, and the commit step below
        # stages public/sitemap.xml, so the URL set this workflow ships is exactly
        # the thing data/cadence/policy.json governs.
        #
        # It ran without this gate until 2026-08-28, when it committed four new
        # URLs against a cap of two. The cap did not stop it - nothing here
        # measured it - and the failure surfaced the next morning in
        # scheduled-content-release, which does run the gate and was blocked by
        # pages a different workflow had published. A cap enforced on one of the
        # workflows that can publish is not a cap.
        #
        # Read-only: scripts/cadence_gate.cjs writes the ledger only under
        # --accept, which is not passed here. scheduled-content-release remains
        # the single workflow that advances the baseline.
        run: npm run cadence:gate
      - name: Commit citation OS daily outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content/page_opportunities.json data/content/generated_answers.json data/content/page_registry.json data/content/generated_route_copy.json data/routes/route_manifest.json data/routes/redirects.json data/release/release_ledger.json data/atoms/*.json data/atlas/*.json data/intelligence/*.json data/tools/*.json data/templates/*.json data/reports/*.json data/repurposing/*.json public/downloads/free-checklists/* data/metrics/*.json data/citations/*.json data/backlink_handoff/* data/governance/*.json data/experiments/*.json data/self_healing/*.json data/locations/*.json data/validation/*.json data/workflow_traces/*.json public/sitemap.xml reports/ux/product-flow-e2e-report.json
          git diff --cached --quiet || git commit -m "chore(citation-os): daily content and authority expansion"
          bash scripts/workflows/safe-push-main.sh
