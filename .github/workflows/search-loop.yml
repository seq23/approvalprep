name: Search Loop

# The shared search growth engine (seq23/search-loop @v1), owner ruling 1 Nov 2026:
# find easy searches weekly, publish gated /questions/ pages daily (straight away,
# pace 10/day rising to 30 while most are indexed), check every page at
# 2/4/8 weeks and 90 days, strengthen / undo / merge, and upload the weekly
# report artifact "search-loop-week". It replaces the frozen Scheduled Content
# Release lane (retired 1 Nov 2026) and its dry-run governance/self-heal steps:
# the engine's gate and repair are the real ones.
# Throttle every site at once: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: "7 5 * * *"  # America/Chicago, all year (the old release slot)
      timezone: America/Chicago
  # A change to the engine's config or routing is checked on the PR (search-loop v1.12.0
  # stage validate: config + model-routing checks only, no network, no model call; peace-be-still
  # 18 Nov 2026 failed every scheduled run on a routing file nothing checked before merge).
  pull_request:
    paths:
      - search-loop.config.json
      - .github/workflows/search-loop.yml
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('approvalprep-main-writer-pr-{0}', github.ref) || 'approvalprep-main-writer' }}
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@56a1b11eb0262dd00dd4c379db7ff45dfebde4b6
    with:
      engine_ref: v1
      stage: ${{ github.event_name == 'pull_request' && 'validate' || inputs.stage || 'auto' }}
      setup_command: npm ci --no-audit --no-fund
      post_build_command: bash scripts/search-loop/post_build.sh
      commit_command: bash scripts/search-loop/commit.sh
      cloudflare_read_secret: SEARCH_LOOP_CF_ANALYTICS_TOKEN
    secrets:
      BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}  # named stops -> Boss OS Open Loops (search-loop v1.7.0)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_ANALYTICS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
