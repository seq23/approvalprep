name: Search Loop

# The shared search growth engine (seq23/search-loop @v1), owner ruling 1 Nov 2026:
# find easy searches weekly, publish gated /questions/ pages daily (straight away,
# pace 10/day rising to 30 while most are indexed), check every page at
# 2/4/8 weeks and 90 days, strengthen / undo / merge, and upload the weekly
# report artifact "search-loop-week". It replaces the frozen Scheduled Content
# Release lane (retired 1 Nov 2026) and its dry-run governance/self-heal steps:
# the engine's gate and repair are the real ones.
# Throttle every site at once: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: "7 5 * * *"  # America/Chicago, all year (the old release slot)
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: npm ci --no-audit --no-fund
      post_build_command: bash scripts/search-loop/post_build.sh
      commit_command: bash scripts/search-loop/commit.sh
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
