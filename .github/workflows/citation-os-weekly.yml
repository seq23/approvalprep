name: Citation OS Weekly

on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Manual fixture trace only; not production telemetry proof"
        required: false
        default: "true"
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: write

concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  citation-os-weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run citation-os:weekly
        env:
          RUN_MODE: dry_run
          APPROVALPREP_SITE_URL: https://approvalprep.com
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          # Without this the connector takes its NOT_CONFIGURED branch, which
          # OVERWRITES data/intelligence/gsc_search_analytics.json with rows: [] -
          # and this workflow commits data/intelligence/*.json. The daily lane
          # already passes it; the weekly lane would have deleted the only measured
          # Search Console data this repo has ever held.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_WEBMASTER_API_URL: ${{ secrets.BING_WEBMASTER_API_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Observe whether answer engines cite us
        # The probe shipped in seven repos and was invoked by none, so no
        # citation observation was ever taken. Grounded mode reads the pages
        # the answer was actually built from; knowledge mode would only show
        # whether a model memorised the brand, which is not a citation.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: node scripts/llm_citation_probe.mjs --limit 25
      - name: Refresh outbound link health
        # scripts/validate/outbound-link-health.mjs is offline by design: it gates
        # the build on a measured record so CI answers the same whatever a
        # third-party origin is doing this minute. Something has to take that
        # measurement, and it has to be here rather than in the validate lane.
        #
        # Without this step the 120-day freshness limit in that validator is a
        # timer, not a guard: nothing would refresh the ledger and every lane
        # would hard-fail four months from the last manual probe. The commit step
        # below already stages data/citations/*.json, so the refreshed ledger
        # lands on main the same way the rest of the weekly output does.
        run: |
          npm run build
          npm run linkcheck:outbound
      - name: Cadence gate
        # The weekly sequence stages data/routes, data/content and
        # public/sitemap.xml, so it can move the published URL set even though it
        # does not run the page factory. Same rule as the daily lane: anything
        # that commits the sitemap to main is measured against
        # data/cadence/policy.json before it ships.
        #
        # Read-only: the ledger moves only under --accept, which stays in
        # scheduled-content-release.
        run: npm run cadence:gate
      - name: Commit citation OS weekly outputs
        # data/authority_scale/retest_*.json is staged here because this lane is
        # the only thing that writes it. npm run citation-os:weekly runs
        # intelligence:retest-queue and intelligence:retest-evaluate, which write
        # data/authority_scale/retest_queue.json and retest_outcome_ledger.json -
        # and until 2026-08-29 neither path was in this git add set, so every
        # scheduled run recomputed the retest lifecycle and threw it away. Both
        # ledgers have been empty since the commit that introduced them, and
        # validate:retest-lifecycle has therefore reported queueEntries=0
        # outcomes=0 for its whole life while looking like a passing gate.
        # Staged narrowly, not `data/authority_scale`: the 100k fanout blobs in
        # that directory are regenerated by intelligence:analyze and would add
        # megabytes of churn to main every week.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/authority_scale/retest_queue.json data/authority_scale/retest_outcome_ledger.json data/signals/*.json data/intelligence/*.json data/seo/*.json data/metrics/*.json data/citations/*.json data/backlink_handoff/* data/governance/*.json data/reports/*.json data/repurposing/*.json public/downloads/free-checklists/* data/content/*.json data/routes/*.json data/atoms/*.json data/atlas/*.json data/workflow_traces/*.json data/experiments/*.json data/self_healing/*.json data/locations/*.json data/validation/*.json public/sitemap.xml
          git diff --cached --quiet || git commit -m "chore(citation-os): weekly intelligence and lifecycle refresh"
          bash scripts/workflows/safe-push-main.sh
