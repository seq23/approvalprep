name: App preview
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: Run fixture workflow data trace only
        required: false
        default: "false"
  # functions/, migrations/ and wrangler.toml are here because apps/mobile/tests run the server's review code, doors and
  # window date: a server-only change ran none of them before 23 Nov 2026.
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'src/lib/**', 'src/data/letterStudio.ts', 'data/products/products.json', 'data/products/seed_product_registry.json', '.github/workflows/app-preview.yml', 'functions/**', 'migrations/**', 'wrangler.toml', 'docs/APP_BUNDLE_DELIVERY.md']
  pull_request:
    paths: ['apps/mobile/**', 'src/lib/**', 'src/data/letterStudio.ts', 'data/products/products.json', 'data/products/seed_product_registry.json', '.github/workflows/app-preview.yml', 'functions/**', 'migrations/**', 'wrangler.toml', 'docs/APP_BUNDLE_DELIVERY.md']
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_AP_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test scripts/preview/host.test.mjs
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: phone-web-preview
          path: apps/mobile/dist
          if-no-files-found: error
      - name: Publish free phone preview
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/preview/host.mjs approvalprep-app-preview
      - name: Link preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        with:
          script: |
            const body = `Open the phone app preview: ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha}. Free web preview; no Appetize minutes.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
