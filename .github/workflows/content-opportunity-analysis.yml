name: Intelligence - Content Opportunity Analysis
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
  schedule:
    - cron: "27 4 * * 1-5"  # America/Chicago, all year
      timezone: America/Chicago
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # was 20; ~4x median 0.3m over 8 green runs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow content-opportunity-analysis.yml
      - run: npm run intelligence:content-opportunities
      - run: npm run intelligence:recommend-page-actions
      - name: Feed the registry into the search loop's finder
        # citation_opportunity_registry.json is the finder input for the search loop
        # (Search Loop workflow, seq23/search-loop): the subjects with open
        # opportunities become its autocomplete seeds in search-loop.config.json.
        run: npm run search-loop:sync-topics
      - name: Commit opportunity briefs
        run: |
          git config user.name "approvalprep-bot"
          git config user.email "hello@approvalprep.com"
          git add data/intelligence/content_opportunity_briefs.json data/intelligence/citation_opportunity_registry.json search-loop.config.json
          git diff --cached --quiet || git commit -m "Update content opportunity intelligence"
          bash scripts/workflows/safe-push-main.sh
