name: Intelligence - Ingest Free Sources
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
  schedule:
    - cron: "17 8 * * *"
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12  # was 5 (~4x median 0.9m); +build and 99 URL inspections
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow intelligence-ingest-free-sources.yml
      - name: Run free source ingestion
        run: npm run intelligence:free-ingest
        env:
          APPROVALPREP_SITE_URL: ${{ secrets.APPROVALPREP_SITE_URL }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          # The access-token secrets above have never existed on this repo, so the
          # Search Console connectors resolved an empty token and wrote
          # NOT_CONFIGURED on every run. This is the credential the portfolio
          # actually issues, and the connectors now accept it.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_WEBMASTER_API_URL: ${{ secrets.BING_WEBMASTER_API_URL }}
          SERP_IMPORT_CSV: data/imports/serp.csv
          SOCIAL_SIGNAL_IMPORT_JSON: data/imports/social-signals.json
      - name: Index coverage, sitemap registration, measured targets
        # URL Inspection for every sitemap URL (8 parallel, <=150/day) and a
        # sitemaps.list record (submitted if missing), then the measured target
        # set from the 28-day GSC rows just collected. Each writes a NAMED STOP
        # rather than an empty success when Search Console refuses.
        #
        # gsc-truth runs last and runs unconditionally: it joins the 28-day rows
        # to the query history into data/search_intelligence/gsc_truth.json and
        # records, in the committed file, whether today's collection happened.
        # Before it existed a held connector left the last good snapshot in
        # place and the log went green, so a lane collecting three days in seven
        # looked exactly like one collecting daily.
        run: |
          npm run search-intelligence:index-coverage
          npm run search-intelligence:sitemaps
          npm run search-intelligence:targets
          npm run search-intelligence:gsc-truth
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Build and record consolidation candidates
        # Thinness is measured on the built page, so the build comes first.
        run: |
          npm run build
          npm run search-intelligence:consolidation
      - run: npm run validate:all
      - name: Commit intelligence data
        run: |
          git config user.name "approvalprep-bot"
          git config user.email "hello@approvalprep.com"
          git add data/intelligence data/search_intelligence
          git diff --cached --quiet || git commit -m "Refresh free intelligence sources and index coverage"
          bash scripts/workflows/safe-push-main.sh
