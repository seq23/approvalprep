name: Validate
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow validate.yml
      - name: Run canonical severity-aware validator registry
        # No `npm run build` step ahead of this. There used to be one, and it is
        # the reason the 2026-09-02 daily failures were invisible until they
        # reached production.
        #
        # The build is validator 1 inside the registry (see
        # scripts/validate/registry-build-order.mjs), so validate:all now
        # produces dist/ itself in every lane. A build step here would do the
        # same work twice - but worse, it would put this lane in a state no
        # scheduled lane is ever in. citation-os-daily, citation-os-weekly,
        # intelligence-ingest-free-sources and artifact-validation all reach
        # validate:all on a bare checkout with no dist/. When this lane
        # pre-built and they did not, a green pull_request stopped predicting a
        # green schedule: PR #23 added a hard dist/_headers assertion, passed
        # here, and turned the scheduled lanes red every morning after.
        #
        # Held by validate:pre-merge-lane-parity: the lane that authorises a
        # merge must reach validate:all in the same state the scheduled lanes do.
        run: npm run validate:all
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings, including
        # library_over_ceiling, are reported without failing the run.
        #
        # Runs after validate:all on purpose. scripts/cadence_gate.cjs reads
        # every sitemap*.xml it can find, and dist/ is gitignored - until the
        # build runs the only sitemap in the tree is public/sitemap.xml, so the
        # gate would be measuring a stale snapshot rather than what this branch
        # produces. The build is validator 1 of validate:all, so by this step
        # dist/sitemap.xml exists.
        #
        # This step is read-only: scripts/cadence_gate.cjs writes
        # data/cadence/known_urls.json only under --accept, which is not passed
        # here, so the "new since last run" comparison is always against the
        # committed ledger - which is what makes it a real per-branch cap. The
        # ledger is advanced by the one workflow that actually publishes,
        # scheduled-content-release, in its explicit --accept step.
        run: npm run cadence:gate
