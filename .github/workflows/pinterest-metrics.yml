name: Pinterest Metrics
# Weekly visits per pin variant from D1 conversion_events (page views carry their
# utm params). No readable analytics -> NAMED STOP PINTEREST_METRICS_UNAVAILABLE in
# data/pinterest/metrics.json and the run summary, never invented numbers.
on:
  schedule:
    - cron: "20 12 * * 1"   # Mondays ~07:20 CT
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow pinterest-metrics.yml
      - name: Measure Pinterest visits per variant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run pinterest:metrics
      - name: Commit the measurement
        run: |
          git config user.name "approvalprep-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pinterest/metrics.json
          git diff --cached --quiet && { echo "No change to commit."; exit 0; }
          git commit -m "chore(pinterest): weekly pin metrics"
          bash scripts/workflows/safe-push-main.sh
