name: Email nurture tick
# Free sample -> email -> paid (functions/_runtime/nurture.js). Cloudflare Pages has no cron,
# so this calls the site's /api/nurture-run three times a day (the series is one email per
# 3 days, so a few hours of lag cost nothing). The endpoint sends only what is due; a missing
# key answers 503 with a NAMED STOP and this run fails, so a stopped series is never silent.
on:
  schedule:
    - cron: "17 8,13,18 * * *"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: email-nurture
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm ci --no-audit --no-fund
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow email-nurture.yml
      - name: Send what is due
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true') }}
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST https://approvalprep.com/api/nurture-run)
          cat body.json; echo
          test "$code" = "200"
