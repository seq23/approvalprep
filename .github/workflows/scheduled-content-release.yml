name: Scheduled Content Release
on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply delegated authority
        run: npm run governance:apply-authority -- --mode=${{ env.RUN_MODE || 'dry_run' }}
      - name: Triage the delegated-authority queue (proposals only)
        # This does not repair anything and no longer claims to. It matches
        # contract-blocked routes against the approved rewrites and writes
        # data/automation/self_heal_attempts.json, which
        # validate:self-heal-progressions reads and the step below derives the
        # final-block log from. The stage that actually applies a repair is
        # "Self-heal until the release validates" further down.
        run: npm run automation:self-heal-attempt -- --mode=${{ env.RUN_MODE || 'dry_run' }}
      - name: Derive block log and republication queue from proposals
        run: npm run automation:self-heal-revalidate
      - name: Build owner exception index
        run: npm run admin:build-owner-exceptions
      - name: Build notification queue
        run: npm run notifications:build-queue -- --mode=${{ env.RUN_MODE || 'dry_run' }}
      - name: Validate delegated authority and notifications
        run: |
          npm run validate:delegated-authority
          npm run validate:self-heal-progressions
          npm run validate:owner-exceptions
          npm run validate:notification-policy
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: |
          npm run ux:browserless-report
          npm run workflows:trace -- --workflow scheduled-content-release.yml
      - name: Generate and freeze today's low-risk release
        run: npm run content:release
      - name: Build the production site
        run: npm run build
      - name: Cadence gate
        # The publishing path, so this is where the volume cap has to bite: if
        # content:release just published more than data/cadence/policy.json
        # allows per week, the gate exits non-zero, the commit step below never
        # runs, and the release is held instead of shipped.
        #
        # After the build for the same reason as in validate.yml - dist/ carries
        # the sitemap the gate measures.
        #
        # Checking is read-only. scripts/cadence_gate.cjs writes the ledger only
        # under --accept, so this step measures today's release against the last
        # accepted baseline and never moves it. Advancing the baseline is the
        # separate step below, which runs only once this one has cleared.
        run: npm run cadence:gate
      - name: Self-heal until the release validates
        # This replaces a bare `npm run validate:all` here, and it is the first
        # workflow in the repo to run the real repair loop: before today
        # `grep -rl selfheal .github/workflows/` returned nothing, so
        # scripts/selfheal/heal-until-clean.mjs - a working
        # validate -> repair -> re-validate -> retry loop with an npm script -
        # was never executed by anything.
        #
        # It runs the full 112-validator registry chain. On a HARD_FAIL it looks
        # up the failing validator's `repairCommand` in
        # _repo_validation_registry.json, runs it, and re-validates. So a content
        # failure that has a registered repair is now actually repaired and
        # re-checked inside the release rather than just failing the run.
        #
        # It is not weaker than the gate it replaces: it exits non-zero unless
        # `validate:all` itself exited zero on a real pass, so nothing publishes
        # on a repair that did not take. Only 4 of the 112 validators declare a
        # repairCommand, so most failures legitimately end at
        # NO_REPAIR_AVAILABLE - which it prints by name, with the blocking
        # validator ids, and exits non-zero on. That is a diagnosis, not a crash
        # and not a silent pass.
        run: npm run selfheal
      - name: Rebuild and re-measure after any repair
        # A repair can change published content, and both the build output and
        # the cadence gate above were measured before it ran. Re-running the
        # build and the (read-only) gate keeps dist/ and the cap honest about
        # what is actually being shipped. It never advances the ledger; that is
        # the --accept step below, which still runs only after this clears.
        run: |
          npm run build
          npm run cadence:gate
      - name: Run safe automation boundary
        run: npm run automation:safe -- --mode=dry_run
      - name: Validate automation safety
        run: npm run validate:automation-safety
      - name: Record the released URL set as the new cadence baseline
        # This is the step that makes the cap a rate rather than a ratchet.
        #
        # "New since the last run" is measured against data/cadence/known_urls.json.
        # Nothing else in this repo writes that ledger: validate.yml only checks,
        # and checking deliberately stopped writing it so the gate cannot consume
        # its own evidence. So if the one workflow that actually publishes does not
        # record what it published, the ledger freezes at its last accepted value
        # while content:release keeps adding pages, and the count of "new" URLs
        # climbs every single day until it crosses new_pages_per_week and stays
        # over it forever - a permanent daily red with no bad release behind it.
        # Measured on the pre-fix workflow at one page per day: CLEAR, CLEAR, then
        # BLOCKED on day 3 and every day after.
        #
        # This does not soften the cap. It runs only after the gate above exited
        # zero, so a day that publishes more than the policy allows still fails at
        # that step and never reaches this one. What it records is a release that
        # already passed the cap and the full validator registry, and the reason
        # names the run, so the ledger stays an audit record of accepted releases
        # rather than a re-run. It must stay ahead of the commit step below, whose
        # staged data/ paths are what carry the advanced ledger back to main.
        run: |
          npm run cadence:gate -- --accept --reason \
            "scheduled-content-release run ${{ github.run_id }} on $(date -u +%F): cadence gate CLEAR and validate:all green; recording the released URL set as the baseline the cap applies from tomorrow."
      - name: Commit and publish validated content
        run: |
          git config user.name "approvalprep-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/sitemap.xml
          if [ -d reports ]; then git add reports; fi
          git diff --cached --quiet || git commit -m "chore(content): scheduled content release"
          bash scripts/workflows/safe-push-main.sh
