name: Intelligence - Page Refresh Queue
on:
  workflow_dispatch:
    inputs:
      fixture_trace:
        description: "Run fixture workflow data trace only"
        required: false
        default: "false"
  schedule:
    - cron: "20 4 * * 6"  # America/Chicago, all year
      timezone: America/Chicago
permissions:
  contents: write
concurrency:
  group: approvalprep-main-writer
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # was 20; ~4x median 0.2m over 8 green runs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize latest main
        run: bash scripts/workflows/prepare-main-writer.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      # The delegated-authority / self-heal / notification-queue steps that stood here
      # ran in dry_run, committed nothing and repaired nothing (removed 1 Nov 2026).
      # Real repair of published pages is the search loop's CHECK + REPAIR stage
      # (Search Loop workflow, seq23/search-loop): strengthen, undo, merge.
      - name: Run fixture workflow trace
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fixture_trace == 'true' }}
        run: npm run workflows:trace -- --workflow page-refresh-queue.yml
      - run: npm run intelligence:growth-maintenance
      - run: npm run validate:maintenance-briefs
      - name: Commit refresh queue
        run: |
          git config user.name "approvalprep-bot"
          git config user.email "hello@approvalprep.com"
          git add data/intelligence/page_refresh_queue.json data/intelligence/growth_maintenance_briefs.json
          git diff --cached --quiet || git commit -m "Update page refresh queue"
          bash scripts/workflows/safe-push-main.sh
      - name: Validate automation safety
        run: npm run validate:automation-safety
